[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-analyzer"
description = "SONAR telemetri ve veri analiz arayuzu"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.9"
dynamic = ["version"]

# Cekirdek katman (domain, io, repository, processing) Qt'ye bagimli DEGILDIR.
# Plan Bolum 7.1 kurali: GUI, .bin byte duzenini bilmez; cekirdek de GUI'yi bilmez.
# Bu ayrim burada bagimlilik seviyesinde zorlanir.
dependencies = [
    # numpy ust sinir bilincli: tip taslaklari (stub) surumle degisiyor ve
    # 3.9 ile 3.12 ayaklarinda farkli numpy secilirse pyright ayni kodda
    # farkli sonuc veriyor. 2.0.x hem 3.9 hem 3.12 destekliyor.
    "numpy>=1.26,<2.1",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]
dsp = [
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    # Lint ve tip denetleyicileri SABIT surumde tutulur: yeni surum yeni kural
    # getirir ve ayni kod yerelde gecerken CI'da kalir. Surum yukseltmesi
    # bilincli bir is olarak yapilir.
    "ruff==0.16.6",
    "pyright==1.1.411",
]

[project.scripts]
sonar-analyzer = "sonar_analyzer.app:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gui: PySide6 gerektiren testler",
    "slow: uzun suren testler",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py39"
# Markdown belgelerindeki Python ornekleri bilerek elle yazilmistir; bicimlendirici
# plan.md ve docs/ altindaki anlatimi degistirmesin.
extend-exclude = ["*.md", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # belgelerde ve mesajlarda Turkce karakterler bilerek kullaniliyor
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Testlerde assert kullanimi ve uzun aciklayici isimler normaldir.
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["sonar_analyzer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = [".venv", "**/__pycache__", "**/node_modules"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"          # calisma zamani hedefi 3.12 olunca guncellenecek (D-20)
pythonPlatform = "Windows"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
