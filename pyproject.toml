[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar-analyzer"
description = "SONAR telemetri ve veri analiz arayuzu"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.9"
dynamic = ["version"]

# Cekirdek katman (domain, io, repository, processing) Qt'ye bagimli DEGILDIR.
# Plan Bolum 7.1 kurali: GUI, .bin byte duzenini bilmez; cekirdek de GUI'yi bilmez.
# Bu ayrim burada bagimlilik seviyesinde zorlanir.
dependencies = [
    # numpy ust sinir bilincli: tip taslaklari (stub) surumle degisiyor ve
    # 3.9 ile 3.12 ayaklarinda farkli numpy secilirse pyright ayni kodda
    # farkli sonuc veriyor. 2.0.x hem 3.9 hem 3.12 destekliyor.
    "numpy>=1.26,<2.1",
    # Profil C sema dosyalari TOML (F7-006+). `tomllib` Python 3.11'de
    # standart kutuphaneye girdi; bu proje 3.9 uzerinde kostugu icin geri
    # tasima gerekiyor (D-20). Kod once `tomllib`'i dener, yoksa `tomli`ye
    # duser — 3.11+ ortamda bu paket hic kurulmaz.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gui = [
    # PySide6 SABIT surumde: tip taslaklari surumler arasinda degisiyor.
    # Ornegin QTreeWidgetItem.child() bir surumde "QTreeWidgetItem", digerinde
    # "QTreeWidgetItem | None" donuyor ve ayni kod bir Python ayaginda gecip
    # digerinde kaliyordu.
    "PySide6==6.10.3",
    "pyqtgraph>=0.13",
]
dsp = [
    "scipy>=1.11",
]
live = [
    # Serial port bağlantısı (F5-009+). Kurulu değilse `SerialConnection.connect()`
    # açık bir hata verir; UDP/TCP kaynakları bu ekstradan etkilenmez.
    "pyserial>=3.5",
]
package = [
    # ADR-012: PyInstaller secildi (onedir). Surum SABIT: paketleyici surumu
    # degistiginde uretilen artefakt da degisir ve "ayni kaynak, ayni paket"
    # sozu tutmaz.
    "pyinstaller==6.22.2",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    # Lint ve tip denetleyicileri SABIT surumde tutulur: yeni surum yeni kural
    # getirir ve ayni kod yerelde gecerken CI'da kalir. Surum yukseltmesi
    # bilincli bir is olarak yapilir.
    "ruff==0.16.6",
    "pyright==1.1.411",
    # F6-013: coverage olcumu ve esikleri.
    "pytest-cov>=5.0",
    # F6-014: bagimlilik guvenlik taramasi.
    "pip-audit>=2.7",
]

[project.scripts]
sonar-analyzer = "sonar_analyzer.app:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gui: PySide6 gerektiren testler",
    "slow: uzun suren testler",
]

[tool.coverage.run]
branch = true
source = ["src/sonar_analyzer"]
# Qt arayuzu ve olcum araclari coverage hedefinin disindadir: ilki
# ekran/etkilesim gerektirir ve zaten GUI testleriyle ayri kapsanir,
# ikincisi urun kodu degildir.
omit = [
    "*/__main__.py",
]

[tool.coverage.report]
# F6-013: plan Bolum 21 genel esigi. Kritik parser/domain icin daha
# yuksek esik tools/coverage_gate.py ile ayrica denetlenir.
fail_under = 70
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py39"
# Markdown belgelerindeki Python ornekleri bilerek elle yazilmistir; bicimlendirici
# plan.md ve docs/ altindaki anlatimi degistirmesin.
extend-exclude = ["*.md", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # belgelerde ve mesajlarda Turkce karakterler bilerek kullaniliyor
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Testlerde assert kullanimi ve uzun aciklayici isimler normaldir.
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["sonar_analyzer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = [".venv", "**/__pycache__", "**/node_modules"]
venvPath = "."
venv = ".venv"
# pythonVersion BILEREK sabitlenmedi: pyright ortamdaki yorumlayici surumunu
# kullanir. Sabit "3.9" verildiginde CI'nin 3.12 ayagi, 3.12 stdlib ile 3.9 dil
# surumunu birlestirip yalnizca o ayakta hata uretiyordu. Matris zaten her iki
# surumu ayri ayri denetliyor.
pythonPlatform = "Windows"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Qt taslaklari bazi surumlerde donusu opsiyonel saymiyor; oysa Qt gercekten
# nullptr donebiliyor. "is not None" kontrollerini korumak icin bu STIL kurali
# kapali. Guvenlik kurallari (reportOptionalMemberAccess vb.) acik kaliyor.
reportUnnecessaryComparison = false

# PyQtGraph tip taslagi (stub) tasimiyor; strict modda her cagri "bilinmeyen tip"
# sayiliyor. Ayrica `pg.ViewBox`/`pg.PlotDataItem` gibi yeniden disa aktarilan
# siniflar pyright'ta alt-MODUL olarak cozuluyor: tip olarak kullanmak
# (reportInvalidTypeForm), cagirmak (reportCallIssue) ve sinif sabitine erismek
# (reportAttributeAccessIssue) hata veriyor. Gevsetme YALNIZ grafik adaptor
# katmaniyla sinirli: ADR-002'ye gore PyQtGraph'in gorundugu tek yer burasi ve
# disariya DataChunk/ChannelMetadata ciktigi icin bu bu klasorun disina sizmiyor.
[[tool.pyright.executionEnvironments]]
root = "src/sonar_analyzer/ui/plots"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportOptionalMemberAccess = "none"
reportInvalidTypeForm = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"

[[tool.pyright.executionEnvironments]]
root = "."
