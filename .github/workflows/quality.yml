name: quality

# Kalite kapisi (F1-006): lint, bicim, tip ve test ayni is akisinda.
# Plan Bolum 21: basarisiz kalite kapisiyla release uretilmez.

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9  : su an gelistirme makinesinde kurulu olan surum
        # 3.12 : plan Bolum 2 hedefi (acik karar D-20)
        python-version: ["3.9", "3.12"]

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: Surum ve arac bilgileri
        run: |
          python -c "import sonar_analyzer; print('uygulama', sonar_analyzer.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -m ruff --version
          python -m pyright --version

      - name: Lint (ruff check)
        run: python -m ruff check --output-format=github .

      - name: Bicim (ruff format --check)
        run: python -m ruff format --check .

      - name: Tip kontrolu (pyright, strict)
        run: |
          # pyright hata bulunca 1 ile cikar; "bash -e" burada durmasin diye
          # cikis kodu yutulur, karar donusturucu adimda verilir.
          python -m pyright --outputjson > pyright.json || true
          python tools/pyright_annotations.py pyright.json
        shell: bash

      - name: Testler ve coverage (Qt gerektirmeyenler)
        run: python -m pytest -m "not gui" -q --cov --cov-report= --cov-fail-under=0

      - name: Testler ve coverage (GUI, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        # Ikinci kosu birincinin uzerine EKLENIR (--cov-append): esikler
        # iki kosunun TOPLAMINA gore denetlenir, yoksa GUI disi kosu tek
        # basina dusuk gorunur ve kapi yanlis yerden kirilir.
        run: >
          python -m pytest -m gui -q --cov --cov-append
          --cov-report=term --cov-report=json

      - name: Coverage esikleri (genel ve kritik paketler)
        # Genel esik pyproject'teki fail_under, kritik paket esikleri
        # tools/coverage_gate.py icinde (F6-013).
        run: python tools/coverage_gate.py

      - name: Bagimlilik taramasi (F6-014)
        # Engelleyici olcut: bulgu KULLANICIYA GIDEN bir bagimliliktaysa
        # is basarisiz olur. Gelistirme araclarindaki bulgular raporlanir
        # ama yayini durdurmaz.
        run: |
          python -m pip install pip-audit
          python tools/dependency_scan.py

  todo-sync:
    name: todo.md plan.md ile guncel mi
    runs-on: windows-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: todo.md guncelligini dogrula
        run: python tools/sync_todo.py --check
